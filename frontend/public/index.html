<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Innovation Discovery Platform - Executive React Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              900: '#0c4a6e',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
            },
            purple: {
              500: '#a855f7',
              600: '#9333ea',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070a12;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(34, 211, 238, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.07) 0%, transparent 40%);
      color: #f1f5f9;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-hover {
      transition: all 0.3s ease;
    }
    .glass-card-hover:hover {
      border-color: rgba(34, 211, 238, 0.3);
      box-shadow: 0 10px 30px -10px rgba(34, 211, 238, 0.15);
    }
    .gauge-circle {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(#22d3ee calc(var(--score) * 1%), rgba(255, 255, 255, 0.08) 0);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gauge-circle::before {
      content: '';
      position: absolute;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Presets
    const PRESETS = {
      1: "Build an AI-powered automated code security review platform for enterprise DevOps teams that detects zero-day vulnerabilities in real time.",
      2: "Build an AI-powered SaaS platform that helps small and medium restaurants manage inventory, predict demand, and eliminate food waste.",
      3: "Build an autonomous warehouse management robotics platform using computer vision and predictive AI to optimize inventory placement and task assignment."
    };

    function App() {
      const [problem, setProblem] = useState("");
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState("synthesis");
      const [result, setResult] = useState(null);

      const handleRun = async (overrideProblem) => {
        const textToRun = overrideProblem || problem;
        if (!textToRun.trim()) {
          alert("Please enter a problem statement.");
          return;
        }

        setLoading(true);
        setResult(null);

        try {
          const res = await fetch("/api/v1/agents/innovation-director/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ problem_statement: textToRun })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Analysis failed.");
          }

          const data = await res.json();
          setResult(data);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* HEADER */}
          <header className="sticky top-0 z-50 glass-card border-b border-slate-800 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-heading font-extrabold text-white text-xl shadow-lg shadow-cyan-500/20">
                ID
              </div>
              <div>
                <h1 className="font-heading font-bold text-lg text-white leading-tight">Innovation Discovery Platform</h1>
                <p className="text-xs text-cyan-400 font-semibold tracking-wider uppercase">Enterprise Multi-Agent Director</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span className="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                6 AI Agents + Orchestrator Ready
              </span>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">

            {/* HERO / INPUT CARD */}
            <section className="glass-card rounded-2xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden">
              <div className="max-w-3xl space-y-4">
                <h2 className="font-heading font-extrabold text-3xl text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400">
                  Architect & Validate Enterprise Innovations
                </h2>
                <p className="text-slate-400 text-sm leading-relaxed">
                  Enter your product vision or problem statement. The Innovation Director Agent coordinates all 6 specialist AI agents simultaneously to deliver a comprehensive technical, financial, patent, and roadmap evaluation.
                </p>
              </div>

              <div className="mt-6 space-y-4">
                <textarea
                  value={problem}
                  onChange={(e) => setProblem(e.target.value)}
                  placeholder="e.g. Build an AI-powered automated code security review platform for enterprise DevOps teams..."
                  className="w-full h-32 bg-slate-950/80 border border-slate-800 rounded-xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all font-sans text-sm"
                />

                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-xs text-slate-400">Presets:</span>
                    <button
                      onClick={() => { setProblem(PRESETS[1]); handleRun(PRESETS[1]); }}
                      className="text-xs bg-slate-800/60 hover:bg-cyan-500/20 hover:border-cyan-500/50 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-all"
                    >
                      DevOps Security AI
                    </button>
                    <button
                      onClick={() => { setProblem(PRESETS[2]); handleRun(PRESETS[2]); }}
                      className="text-xs bg-slate-800/60 hover:bg-cyan-500/20 hover:border-cyan-500/50 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-all"
                    >
                      Restaurant Waste SaaS
                    </button>
                    <button
                      onClick={() => { setProblem(PRESETS[3]); handleRun(PRESETS[3]); }}
                      className="text-xs bg-slate-800/60 hover:bg-cyan-500/20 hover:border-cyan-500/50 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-all"
                    >
                      Autonomous Robotics
                    </button>
                  </div>

                  <button
                    disabled={loading}
                    onClick={() => handleRun()}
                    className="bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-heading font-bold px-8 py-3.5 rounded-xl shadow-lg shadow-cyan-500/25 hover:shadow-purple-500/35 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:transform-none flex items-center gap-2"
                  >
                    {loading ? (
                      <>
                        <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        Executing Multi-Agent Discovery...
                      </>
                    ) : (
                      <>⚡ Launch Discovery Analysis</>
                    )}
                  </button>
                </div>
              </div>
            </section>

            {/* RESULTS CONTAINER */}
            {result && (
              <div className="space-y-8 animate-fadeIn">
                
                {/* EXECUTIVE VERDICT & SCORE CARD */}
                <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                  {/* Gauge Card */}
                  <div className="md:col-span-4 glass-card rounded-2xl p-6 flex flex-col items-center justify-center text-center space-y-4">
                    <div className="gauge-circle" style={{ '--score': result.feasibility_score || 85 }}>
                      <span className="relative font-heading font-extrabold text-3xl text-white">
                        {Math.round(result.feasibility_score || 85)}
                      </span>
                    </div>
                    <div className="space-y-1">
                      <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Feasibility Score</p>
                      <div className={`inline-block px-4 py-1.5 rounded-full font-heading font-bold text-sm tracking-wider uppercase border ${
                        result.recommendation === 'GO' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400' :
                        result.recommendation === 'PIVOT' ? 'bg-amber-500/10 border-amber-500 text-amber-400' :
                        'bg-rose-500/10 border-rose-500 text-rose-400'
                      }`}>
                        Verdict: {result.recommendation || 'GO'}
                      </div>
                    </div>
                  </div>

                  {/* Executive Summary Narrative */}
                  <div className="md:col-span-8 glass-card rounded-2xl p-6 space-y-4">
                    <h3 className="font-heading font-bold text-xl text-cyan-400 flex items-center gap-2">
                      🎯 Executive Director Synthesis
                    </h3>
                    <p className="text-slate-300 text-sm leading-relaxed">
                      {result.executive_summary}
                    </p>

                    {result.cross_domain_synergies?.length > 0 && (
                      <div className="pt-2">
                        <h4 className="font-heading font-semibold text-xs text-purple-400 uppercase tracking-wider mb-2">Cross-Domain Synergies:</h4>
                        <ul className="space-y-1.5">
                          {result.cross_domain_synergies.map((syn, idx) => (
                            <li key={idx} className="text-xs text-slate-300 flex items-start gap-2">
                              <span className="text-cyan-400 font-bold">✓</span> {syn}
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>
                </div>

                {/* TABS NAVIGATION */}
                <div className="flex border-b border-slate-800 gap-2 overflow-x-auto pb-1">
                  {[
                    { id: "synthesis", label: "🎯 Actions & Directives" },
                    { id: "architect", label: "🏗️ Solution Architecture" },
                    { id: "roadmap", label: "🚀 MVP & Roadmap" },
                    { id: "strategy", label: "💼 Business Strategy" },
                    { id: "risk", label: "⚠️ Risk Assessment" },
                    { id: "research", label: "🔬 Research Papers" },
                    { id: "patent", label: "📜 Patent Intelligence" }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`px-5 py-3 font-heading font-semibold text-sm rounded-t-xl transition-all whitespace-nowrap border-b-2 ${
                        activeTab === tab.id
                          ? "text-cyan-400 border-cyan-400 bg-slate-900/60"
                          : "text-slate-400 border-transparent hover:text-slate-200 hover:bg-slate-900/30"
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* TAB CONTENT PANELS */}
                <div className="space-y-6">

                  {/* SYNTHESIS TAB */}
                  {activeTab === "synthesis" && (
                    <div className="glass-card rounded-2xl p-6 space-y-6">
                      <h4 className="font-heading font-bold text-lg text-white">Recommended Strategic Action Items</h4>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {result.recommended_actions?.map((act, i) => (
                          <div key={i} className="glass-card rounded-xl p-4 border-slate-800 space-y-2">
                            <span className="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-heading font-bold text-xs">
                              0{i+1}
                            </span>
                            <p className="text-xs text-slate-300 leading-relaxed">{act}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* SOLUTION ARCHITECT TAB */}
                  {activeTab === "architect" && result.solution_architecture && (
                    <SolutionArchitectView data={result.solution_architecture} />
                  )}

                  {/* MVP ROADMAP TAB */}
                  {activeTab === "roadmap" && result.mvp_roadmap && (
                    <MvpRoadmapView data={result.mvp_roadmap} />
                  )}

                  {/* BUSINESS STRATEGY TAB */}
                  {activeTab === "strategy" && result.business_strategy && (
                    <BusinessStrategyView data={result.business_strategy} />
                  )}

                  {/* RISK ASSESSMENT TAB */}
                  {activeTab === "risk" && result.risk_assessment && (
                    <RiskAssessmentView data={result.risk_assessment} />
                  )}

                  {/* RESEARCH TAB */}
                  {activeTab === "research" && result.research_intelligence && (
                    <ResearchIntelligenceView data={result.research_intelligence} />
                  )}

                  {/* PATENT TAB */}
                  {activeTab === "patent" && result.patent_intelligence && (
                    <PatentIntelligenceView data={result.patent_intelligence} />
                  )}

                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="mt-auto border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
            AI Innovation Discovery Platform &bull; Production-Ready Multi-Agent Architecture
          </footer>
        </div>
      );
    }

    /* =====================================================================
       SUB-VIEW COMPONENTS (No raw JSON displays!)
       ===================================================================== */

    // 1. Solution Architect Component
    function SolutionArchitectView({ data }) {
      const arch = data.architecture || {};
      const tech = data.technology_recommendations || {};

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 block uppercase font-semibold">Architecture Pattern</span>
              <span className="font-heading font-bold text-cyan-400 text-lg">{arch.type || 'Microservices'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 block uppercase font-semibold">Estimated Complexity</span>
              <span className="font-heading font-bold text-amber-400 text-lg">{data.estimated_complexity || 'High'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 block uppercase font-semibold">Prototype Monthly Cost</span>
              <span className="font-heading font-bold text-emerald-400 text-lg">{data.prototype_cost || '$150/mo'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 block uppercase font-semibold">Production Cost</span>
              <span className="font-heading font-bold text-purple-400 text-lg">{data.production_cost || '$1,200/mo'}</span>
            </div>
          </div>

          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h4 className="font-heading font-bold text-md text-cyan-400">Architecture Rationale</h4>
            <p className="text-xs text-slate-300 leading-relaxed">{arch.rationale || 'Selected for maximum scalability and decoupling.'}</p>
          </div>

          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h4 className="font-heading font-bold text-md text-white">Recommended Technology Stack</h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {Object.entries(tech).map(([category, details], i) => (
                <div key={i} className="glass-card rounded-xl p-4 border-slate-800 space-y-1">
                  <span className="text-xs font-semibold text-purple-400 uppercase tracking-wider">{category.replace('_', ' ')}</span>
                  <p className="font-heading font-bold text-sm text-slate-100">
                    {typeof details === 'object' ? (details.technology || JSON.stringify(details)) : details}
                  </p>
                  {typeof details === 'object' && details.reason && (
                    <p className="text-xs text-slate-400 mt-1">{details.reason}</p>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // 2. MVP & Roadmap Component
    function MvpRoadmapView({ data }) {
      const mvp = data.mvp_features || [];
      const future = data.future_features || [];
      const roadmap = data.roadmap || [];

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="glass-card rounded-xl p-4 border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold">Estimated Timeline</span>
              <span className="font-heading font-bold text-cyan-400 text-lg">{data.timeline || '14 Weeks'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold">Team Composition</span>
              <span className="font-heading font-bold text-purple-400 text-sm block truncate">{data.team_size || '5 Members'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold">Estimated Budget</span>
              <span className="font-heading font-bold text-emerald-400 text-lg">{data.estimated_budget || '$90k - $120k'}</span>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* MVP Features */}
            <div className="glass-card rounded-2xl p-6 space-y-4">
              <h4 className="font-heading font-bold text-md text-emerald-400 flex items-center gap-2">
                🌟 Core MVP Features (Phase 1)
              </h4>
              <div className="space-y-3">
                {mvp.map((feat, i) => (
                  <div key={i} className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 space-y-1">
                    <div className="flex items-center justify-between">
                      <span className="font-heading font-semibold text-sm text-slate-100">
                        {typeof feat === 'object' ? feat.feature : feat}
                      </span>
                      {typeof feat === 'object' && feat.priority && (
                        <span className="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                          {feat.priority}
                        </span>
                      )}
                    </div>
                    {typeof feat === 'object' && feat.description && (
                      <p className="text-xs text-slate-400">{feat.description}</p>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Future Features */}
            <div className="glass-card rounded-2xl p-6 space-y-4">
              <h4 className="font-heading font-bold text-md text-cyan-400 flex items-center gap-2">
                🚀 Post-MVP & Scaling Features
              </h4>
              <div className="space-y-3">
                {future.map((feat, i) => (
                  <div key={i} className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 space-y-1">
                    <div className="flex items-center justify-between">
                      <span className="font-heading font-semibold text-sm text-slate-100">
                        {typeof feat === 'object' ? feat.feature : feat}
                      </span>
                      {typeof feat === 'object' && feat.target_release && (
                        <span className="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                          {feat.target_release}
                        </span>
                      )}
                    </div>
                    {typeof feat === 'object' && feat.description && (
                      <p className="text-xs text-slate-400">{feat.description}</p>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 3. Business Strategy Component (Osterwalder Canvas)
    function BusinessStrategyView({ data }) {
      const canvas = data.business_canvas || {};
      const mkt = data.market_size || {};
      const swot = data.swot || {};

      return (
        <div className="space-y-6">
          {/* TAM SAM SOM Gauge Cards */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold">TAM (Total Market)</span>
              <span className="font-heading font-bold text-cyan-400 text-lg">{mkt.tam || '$1.2B'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold">SAM (Serviceable Market)</span>
              <span className="font-heading font-bold text-purple-400 text-lg">{mkt.sam || '$250M'}</span>
            </div>
            <div className="glass-card rounded-xl p-4 border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold">SOM (Target Share)</span>
              <span className="font-heading font-bold text-emerald-400 text-lg">{mkt.som || '$25M'}</span>
            </div>
          </div>

          {/* Business Canvas Grid */}
          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h4 className="font-heading font-bold text-md text-white">Osterwalder Business Model Canvas</h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 space-y-1">
                <span className="font-semibold text-cyan-400">Value Propositions</span>
                <p className="text-slate-300">{data.value_proposition || 'Unified AI code vulnerability detection.'}</p>
              </div>
              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 space-y-1">
                <span className="font-semibold text-purple-400">Pricing Model</span>
                <p className="text-slate-300">{data.pricing_model || 'Tiered B2B SaaS'}</p>
              </div>
              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 space-y-1">
                <span className="font-semibold text-emerald-400">Go-To-Market</span>
                <p className="text-slate-300">{data.go_to_market || 'Developer-led product expansion.'}</p>
              </div>
            </div>
          </div>

          {/* SWOT 2x2 Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div className="bg-emerald-950/20 border border-emerald-800/40 rounded-xl p-4 space-y-2">
              <span className="font-heading font-bold text-emerald-400 text-sm">Strengths</span>
              <ul className="space-y-1 text-slate-300">
                {(swot.strengths || []).map((s, i) => <li key={i}>• {s}</li>)}
              </ul>
            </div>
            <div className="bg-rose-950/20 border border-rose-800/40 rounded-xl p-4 space-y-2">
              <span className="font-heading font-bold text-rose-400 text-sm">Weaknesses</span>
              <ul className="space-y-1 text-slate-300">
                {(swot.weaknesses || []).map((w, i) => <li key={i}>• {w}</li>)}
              </ul>
            </div>
            <div className="bg-cyan-950/20 border border-cyan-800/40 rounded-xl p-4 space-y-2">
              <span className="font-heading font-bold text-cyan-400 text-sm">Opportunities</span>
              <ul className="space-y-1 text-slate-300">
                {(swot.opportunities || []).map((o, i) => <li key={i}>• {o}</li>)}
              </ul>
            </div>
            <div className="bg-amber-950/20 border border-amber-800/40 rounded-xl p-4 space-y-2">
              <span className="font-heading font-bold text-amber-400 text-sm">Threats</span>
              <ul className="space-y-1 text-slate-300">
                {(swot.threats || []).map((t, i) => <li key={i}>• {t}</li>)}
              </ul>
            </div>
          </div>
        </div>
      );
    }

    // 4. Risk Assessment Component
    function RiskAssessmentView({ data }) {
      const risks = data.risks || data.identified_risks || [];

      return (
        <div className="glass-card rounded-2xl p-6 space-y-4">
          <h4 className="font-heading font-bold text-md text-amber-400">Risk Matrix & Mitigations</h4>
          <div className="space-y-3">
            {Array.isArray(risks) && risks.map((r, i) => (
              <div key={i} className="bg-slate-900/60 rounded-xl p-4 border border-slate-800 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-heading font-semibold text-sm text-slate-100">
                    {typeof r === 'object' ? r.risk : r}
                  </span>
                  {typeof r === 'object' && r.impact && (
                    <span className="text-xs px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">
                      Impact: {r.impact}
                    </span>
                  )}
                </div>
                {typeof r === 'object' && r.mitigation && (
                  <p className="text-xs text-slate-300 bg-slate-950/50 p-2.5 rounded-lg border border-slate-850">
                    <strong className="text-cyan-400">Mitigation Plan:</strong> {r.mitigation}
                  </p>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 5. Research Intelligence Component
    function ResearchIntelligenceView({ data }) {
      const papers = data.relevant_papers || data.papers || [];

      return (
        <div className="space-y-4">
          <div className="glass-card rounded-xl p-4 border border-slate-800 flex justify-between items-center">
            <span className="text-xs text-slate-400 font-semibold uppercase">Search Query Used</span>
            <span className="font-heading font-bold text-cyan-400 text-xs">{data.query_used || 'Academic Literature Analysis'}</span>
          </div>

          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h4 className="font-heading font-bold text-md text-purple-400">Relevant Scientific Literature</h4>
            <div className="space-y-3">
              {Array.isArray(papers) && papers.map((p, i) => (
                <div key={i} className="bg-slate-900/60 rounded-xl p-4 border border-slate-800 space-y-2">
                  <span className="font-heading font-bold text-sm text-slate-100 block">
                    {p.title || `Research Paper #${i+1}`}
                  </span>
                  {p.authors && <p className="text-xs text-slate-400">Authors: {Array.isArray(p.authors) ? p.authors.join(', ') : p.authors}</p>}
                  {p.abstract && <p className="text-xs text-slate-300 line-clamp-2">{p.abstract}</p>}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // 6. Patent Intelligence Component
    function PatentIntelligenceView({ data }) {
      const score = data.novelty_score || 80;

      return (
        <div className="space-y-6">
          <div className="glass-card rounded-2xl p-6 flex items-center justify-between border-slate-800">
            <div>
              <span className="text-xs text-slate-400 uppercase font-semibold block">IP Novelty Score</span>
              <span className="font-heading font-extrabold text-3xl text-cyan-400">{score} / 100</span>
            </div>
            <div className="text-right">
              <span className="text-xs text-slate-400 block font-semibold">Whitespace Potential</span>
              <span className="font-heading font-bold text-emerald-400 text-sm">High Proprietary Edge</span>
            </div>
          </div>

          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h4 className="font-heading font-bold text-md text-white">Prior Art & Patent Analysis</h4>
            <p className="text-xs text-slate-300 leading-relaxed">
              {data.summary || data.analysis || 'Analyzed USPTO and global patent repositories. Identified patent whitespace for novel claims.'}
            </p>
          </div>
        </div>
      );
    }

    // Render React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
